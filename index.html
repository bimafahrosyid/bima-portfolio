<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .portfolio-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .portfolio-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            background-color: #222;
        }
    </style>
</head>
<body>
    <h1>Portofolio Saya</h1>
    <div class="portfolio-container">
        <img src="slide-1.jpg" alt="Portofolio 1" class="portfolio-img" loading="lazy">

        <img src="slide-3.jpg" alt="Portofolio 3" class="portfolio-img" loading="lazy">
